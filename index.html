<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>갓생 픽셀 위젯 만들기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  body{margin:0;background:#191919;color:#f3e6c8;font-family:Galmuri11,monospace;padding:32px 20px}
  main{max-width:720px;margin:0 auto}
  h1{font-family:Galmuri14,monospace;font-size:24px;color:#ffd58a;margin:0 0 6px}
  p{color:#b9a68e;font-size:13px;line-height:1.7}
  section{background:#2e251f;padding:18px;margin:18px 0;box-shadow:0 0 0 4px #5a4838}
  h2{font-size:15px;color:#86b26f;margin:0 0 12px}
  label{display:block;font-size:12px;color:#b9a68e;margin:10px 0 4px}
  input,select{width:100%;box-sizing:border-box;background:#191919;color:#f3e6c8;border:0;box-shadow:0 0 0 2px #5a4838;padding:8px;font-family:inherit}
  iframe{width:100%;height:150px;border:0;margin-top:12px;background:#191919}
  .url{display:flex;gap:8px;margin-top:10px}
  .url input{flex:1}
  button{background:#f2b35b;color:#191919;border:0;padding:8px 14px;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #a8752c}
  ol{color:#b9a68e;font-size:13px;line-height:1.8;padding-left:20px}
</style>
</head>
<body><main>
<h1>🐈‍⬛ 갓생 픽셀 위젯</h1>
<p>원하는 위젯을 고르고 주소를 복사해서 노션에 붙여넣으세요. 로그인도, 개인정보 입력도 필요 없어요.</p>

<section>
  <h2>노션에 넣는 법</h2>
  <ol>
    <li>아래에서 위젯을 고르고 <b>주소 복사</b>를 눌러요.</li>
    <li>노션에서 <b>/임베드</b>(또는 /embed)를 입력하고 주소를 붙여넣어요.</li>
    <li>위젯 모서리를 끌어서 크기를 맞춰요.</li>
  </ol>
</section>

<section>
  <h2>위젯 고르기</h2>
  <label>종류</label>
  <select id="w">
    <option value="clock">시계 + 날짜</option>
    <option value="dday">D-day</option>
    <option value="progress">올해·이번 달·주·오늘 진행률</option>
    <option value="pomo">포모도로 타이머</option>
    <option value="quote">오늘의 한마디</option>
    <option value="sound">밤 숲 소리 (빗소리·모닥불·풀벌레·시냇물·바람)</option>  </select>
  <div id="ddopts">
    <label>D-day 이름</label><input id="title" value="토익 시험" maxlength="20">
    <label>날짜</label><input id="date" type="date" value="2027-01-24">
  </div>
  <label>테마</label>
  <select id="theme"><option value="dark">다크</option><option value="light">라이트</option></select>
  <iframe id="pv"></iframe>
  <div class="url"><input id="url" readonly><button id="copy">주소 복사</button></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const base=location.href.replace(/[^/]*(\?.*)?$/,'')+'widget.html';
function upd(){
  const w=$('w').value; $('ddopts').style.display=w==='dday'?'block':'none';
  const q=new URLSearchParams({w});
  if(w==='dday'){q.set('title',$('title').value);q.set('date',$('date').value);}
  if($('theme').value==='light')q.set('theme','light');
  const u=base+'?'+q.toString(); $('url').value=u; $('pv').src=u;
}
['w','title','date','theme'].forEach(i=>$(i).addEventListener('input',upd));
$('copy').onclick=()=>{navigator.clipboard.writeText($('url').value);$('copy').textContent='복사됨!';setTimeout(()=>$('copy').textContent='주소 복사',1200);};
upd();
</script>
</body></html>
