<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gatsaeng Pixel Widget</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root{
    --bg:#191919; --card:#2e251f; --card2:#41342b; --line:#5a4838;
    --amber:#f2b35b; --amber2:#ffd58a; --moss:#9cc07f; --cream:#f3e6c8; --dim:#b9a68e; --pink:#e58a9a;
  }
  body.light{ --bg:#ffffff; --card:#f6efe1; --card2:#efe3cb; --line:#d9c7a3; --cream:#3a3226; --dim:#7d705b; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:Galmuri11,'Galmuri11',monospace;color:var(--cream);display:flex;align-items:center;justify-content:center;
       -webkit-font-smoothing:none;image-rendering:pixelated}
  .card{position:relative;width:min(100%,340px);background:var(--card);padding:16px 18px 14px;
        box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),
                   inset 0 -4px 0 0 rgba(0,0,0,.18)}
  .row{display:flex;align-items:flex-end;gap:12px}
  .cat{flex:none}
  .big{font-family:Galmuri14,'Galmuri14',monospace;font-size:40px;line-height:1;letter-spacing:2px;color:var(--amber2);
       text-shadow:3px 3px 0 rgba(0,0,0,.35)}
  .colon{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.15}}
  .sub{font-size:12px;color:var(--dim);margin-top:6px}
  .label{font-size:12px;color:var(--moss);margin-bottom:6px}
  .bar{display:flex;gap:3px;margin-top:8px}
  .seg{flex:1;height:10px;background:var(--card2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
  .seg.on{background:var(--amber)}
  .seg.half{background:linear-gradient(90deg,var(--amber) 50%,var(--card2) 50%)}
  .lines{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:11px}
  .lines .pct{color:var(--amber2);text-align:right;min-width:34px}
  .stars{position:absolute;inset:0;pointer-events:none}
  .star{position:absolute;width:3px;height:3px;background:var(--amber2);animation:tw 2.4s steps(2) infinite}
  @keyframes tw{50%{opacity:.1}}
  .dd{font-family:Galmuri14,'Galmuri14',monospace;font-size:38px;color:var(--amber2);text-shadow:3px 3px 0 rgba(0,0,0,.35)}
  .dd.today{color:var(--pink)}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;font:inherit;font-size:11px;padding:5px 0;background:var(--card2);color:var(--dim);border:0;cursor:pointer;
       box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
  .tab.on{background:var(--amber);color:#191919}
  .btns{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;font:inherit;font-size:13px;padding:7px 0;border:0;cursor:pointer;background:var(--moss);color:#191919;
       box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .btn.ghost{background:var(--card2);color:var(--cream)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .cnt{font-size:11px;color:var(--dim);margin-top:8px;text-align:right}
  .glow{animation:glow 1.6s steps(2) infinite}
  @keyframes glow{50%{fill:#e08a2c}}
  .zzz{animation:zz 2.4s steps(4) infinite}
  @keyframes zz{0%{transform:translate(0,1px);opacity:0}50%{opacity:1}100%{transform:translate(2px,-2px);opacity:0}}
  .greet{font-size:11px;color:var(--moss);margin-top:3px}
  .snd{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
  .snd .btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10px}
  .snd .btn span{font-size:16px;line-height:1}
  .credit{font-size:9px;color:var(--dim);opacity:.7;margin-top:8px}
  .snd .btn{background:var(--card2);color:var(--dim)}
  .snd .btn.on{background:var(--amber);color:#191919}
  .vol{width:100%;margin-top:10px;accent-color:#f2b35b}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px}
  .cal .h{color:var(--dim);font-size:10px;padding-bottom:2px}
  .cal .d{padding:3px 0;color:var(--cream)}
  .cal .x{opacity:0}
  .cal .sun,.cal .hol{color:var(--pink)}
  .cal .sat{color:#9fb7d9}
  .cal .today{background:var(--amber);color:#191919}
  .next{font-size:11px;color:var(--dim);margin-top:8px}
  .next b{color:var(--amber2);font-weight:normal}
  .quote{font-size:14px;line-height:1.6;color:var(--cream);margin:6px 0 2px;word-break:keep-all}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="stars" id="stars"></div>
  <div id="root"></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const W = (P.get('w')||'clock').toLowerCase();
if ((P.get('theme')||'').toLowerCase()==='light') document.body.classList.add('light');
const DAYS=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');

// 픽셀 검은 고양이 (B=몸, Y=눈, P=코, .=빈칸)
const CAT=[
  "B.....B....",
  "BB...BB....",
  "BBBBBBB....",
  "BYBBBYB....",
  "BBBPBBB....",
  ".BBBBB...B.",
  ".BBBBBB..B.",
  "BBBBBBBB.B.",
  "BBBBBBBBBB.",
  "BBBBBBBBB..",
  ".BB..BB...."
];
// 잠든 고양이 (E=감은 눈)
const SLEEP=[
  "...........",
  "...........",
  "...........",
  "...........",
  "B.....B....",
  "BB...BB....",
  "BBBBBBBBBB.",
  "BEEBEEBBBBB",
  "BBBPBBBBBBB",
  "BBBBBBBBBBB",
  ".BBBBBBBBB."
];
// 시간대 소품 (Y=해, C=종이, R=표지, K=틀, A=불빛, M=달)
const PROPS={
  sun:{x:12,y:0,rows:["..Y..",".YYY.","YYYYY",".YYY.","..Y.."]},
  book:{x:12,y:8,rows:[".CCCCC","CCCCCC","RRRRRR"]},
  lantern:{x:12,y:5,rows:[".KK.","K..K","KAAK","KAAK","KAAK","KKKK"]},
  moon:{x:12,y:0,rows:["..MM",".MM.","MM..","MM..",".MM.","..MM"]}
};
const PAL={B:'#0d0d12',Y:'#f5d76e',P:'#e58a9a',E:'#4a4a5a',C:'#f3e6c8',R:'#a0603a',K:'#5a4632',A:'#ffcf6b',M:'#f3e6c8'};
function sceneNow(){
  const h=new Date().getHours();
  if(h>=6&&h<11) return {cat:CAT,prop:'sun',greet:'좋은 아침이야 ☀️'};
  if(h>=11&&h<18) return {cat:CAT,prop:'book',greet:'집중 모드 ON 📚'};
  if(h>=18&&h<23) return {cat:CAT,prop:'lantern',greet:'오늘도 수고했어 🏮'};
  return {cat:SLEEP,prop:'moon',greet:'이제 쉬어도 돼 🌙',sleep:true};
}
function catSVG(scale=5, withProp=false){
  const s=withProp?sceneNow():{cat:CAT};
  const rows=s.cat, h=11, w=withProp?18:11; let r='';
  rows.forEach((row,y)=>[...row].forEach((c,x)=>{
    if(c==='.')return;
    r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}" class="${c==='Y'?'eye':''}"/>`;
  }));
  if(withProp){const p=PROPS[s.prop];
    p.rows.forEach((row,y)=>[...row].forEach((c,x)=>{ if(c==='.')return;
      r+=`<rect x="${p.x+x}" y="${p.y+y}" width="1" height="1" fill="${PAL[c]}" class="${c==='A'?'glow':''}"/>`;}));
    if(s.sleep) r+=`<text x="8" y="3" class="zzz" font-size="3" fill="#9aa3b5" font-family="monospace">z</text>`;
  }
  return `<svg class="cat" width="${w*scale}" height="${h*scale}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
}
function blink(){
  document.querySelectorAll('.eye').forEach(e=>e.setAttribute('fill','#0d0d12'));
  setTimeout(()=>document.querySelectorAll('.eye').forEach(e=>e.setAttribute('fill','#f5d76e')),160);
}
setInterval(blink,4200);

// 반딧불
const st=document.getElementById('stars');
for(let i=0;i<6;i++){const s=document.createElement('div');s.className='star';
  s.style.left=(8+Math.random()*84)+'%';s.style.top=(6+Math.random()*30)+'%';s.style.animationDelay=(Math.random()*2.4)+'s';st.appendChild(s);}

const root=document.getElementById('root');
function segs(p,n=10){let o='';for(let i=0;i<n;i++){const v=p*n-i;o+=`<div class="seg ${v>=1?'on':v>=.5?'half':''}"></div>`;}return o;}

function clock(){
  const d=new Date();
  root.innerHTML=`<div class="row">${catSVG(4,true)}<div>
    <div class="big">${pad(d.getHours())}<span class="colon">:</span>${pad(d.getMinutes())}</div>
    <div class="sub">${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${DAYS[d.getDay()]}요일</div>
    <div class="greet">${sceneNow().greet}</div></div></div>`;
}
function dday(){
  const title=P.get('title')||'목표일';
  const ds=P.get('date')||'2027-01-01';
  const t=new Date(ds+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((t-now)/86400000);
  const txt=diff>0?`D-${diff}`:diff===0?'D-DAY':`D+${-diff}`;
  root.innerHTML=`<div class="row">${catSVG(5)}<div>
    <div class="label">${title.replace(/</g,'&lt;')}</div>
    <div class="dd ${diff===0?'today':''}">${txt}</div>
    <div class="sub">${t.getFullYear()}.${pad(t.getMonth()+1)}.${pad(t.getDate())} ${DAYS[t.getDay()]}요일</div></div></div>`;
}
function progress(){
  const n=new Date(),y=n.getFullYear();
  const yS=new Date(y,0,1),yE=new Date(y+1,0,1);
  const mS=new Date(y,n.getMonth(),1),mE=new Date(y,n.getMonth()+1,1);
  const wd=(n.getDay()+6)%7; const wS=new Date(y,n.getMonth(),n.getDate()-wd),wE=new Date(wS.getTime()+7*86400000);
  const dS=new Date(y,n.getMonth(),n.getDate()),dE=new Date(dS.getTime()+86400000);
  const f=(a,b)=>Math.min(1,Math.max(0,(n-a)/(b-a)));
  const rows=[['올해',f(yS,yE)],['이번 달',f(mS,mE)],['이번 주',f(wS,wE)],['오늘',f(dS,dE)]];
  root.innerHTML=`<div class="label">⏳ ${y}년은 지금</div><div class="lines">${rows.map(([k,p])=>
    `<span>${k}</span><div class="bar" style="margin:0">${segs(p)}</div><span class="pct">${Math.floor(p*100)}%</span>`).join('')}</div>`;
}
// 포모도로: 이 브라우저 안에서만 동작, 서버에 아무것도 보내지 않음
function pomo(){
  const MODES={focus:['집중',25],short:['짧은 휴식',5],long:['긴 휴식',15]};
  let mode='focus', left=25*60, running=false, timer=null, done=0;
  root.innerHTML=`<div class="tabs">${Object.entries(MODES).map(([k,[n]])=>`<button class="tab" data-m="${k}">${n}</button>`).join('')}</div>
    <div class="row">${catSVG(5)}<div style="flex:1"><div class="big" id="t">25:00</div><div class="bar" id="pb"></div></div></div>
    <div class="btns"><button class="btn" id="go">시작</button><button class="btn ghost" id="rs">처음으로</button></div>
    <div class="cnt" id="cnt">오늘 완료 0세션</div>`;
  const $=id=>document.getElementById(id);
  const total=()=>MODES[mode][1]*60;
  function draw(){
    $('t').textContent=pad(Math.floor(left/60))+':'+pad(left%60);
    $('pb').innerHTML=segs(1-left/total());
    $('go').textContent=running?'잠깐 멈춤':'시작';
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    $('cnt').textContent=`오늘 완료 ${done}세션 🍅`;
    document.title=(running?'⏳ ':'')+$('t').textContent+' · 갓생 타이머';
  }
  function ding(){try{const a=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=880;
      g.gain.setValueAtTime(.08,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.2);
      o.connect(g).connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.2);});}catch(e){}}
  function stop(){running=false;clearInterval(timer);timer=null;}
  function setMode(m){stop();mode=m;left=total();draw();}
  let endAt=0;
  $('go').onclick=()=>{
    if(running){stop();draw();return;}
    running=true; endAt=Date.now()+left*1000;
    timer=setInterval(()=>{
      left=Math.max(0,Math.round((endAt-Date.now())/1000));
      if(left===0){stop();ding();blink();
        if(mode==='focus'){done++;setMode(done%4===0?'long':'short');}else setMode('focus');return;}
      draw();
    },250);
    draw();
  };
  $('rs').onclick=()=>setMode(mode);
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  draw();
}
// 오늘의 한마디: 날짜마다 바뀌는 직접 쓴 문구
const QUOTES=[
"완벽한 하루 말고, 어제보다 조금 나은 하루면 충분해.","오늘 할 일 하나만 끝내도 오늘은 성공이야.","느려도 괜찮아. 멈추지만 않으면 돼.",
"물 한 잔 마시고 시작하자.","10분만 해보자. 10분이 30분이 될 거야.","잘하고 싶은 마음이 있다는 게 이미 시작이야.",
"쉬는 것도 계획의 일부야.","오늘의 나는 내일의 나에게 선물을 주는 중.","작은 체크 하나가 큰 습관이 돼.",
"남의 속도 말고 내 속도로 가자.","하기 싫은 날에도 조금만 하면, 그게 실력이 돼.","책상 정리부터 하면 마음도 정리돼.",
"할 수 있는 만큼만. 그게 오래 가는 비결이야.","실수해도 괜찮아. 다시 하면 되니까.","오늘 하루도 무사히 여기까지 왔어.",
"지금 이 25분에만 집중해 보자.","어제의 나와만 비교하기.","생각보다 너는 많이 해냈어.",
"계획이 틀어져도 하루는 다시 시작할 수 있어.","꾸준함이 재능을 이겨.","잠을 줄이는 대신 집중을 늘리자.",
"오늘은 딱 하나만 제대로.","아침의 5분이 하루의 방향을 정해.","포기하고 싶을 땐 한 걸음만 더.",
"충분히 잘하고 있어. 정말로.","시작이 반이라면, 체크 하나는 그 절반이야.","휴대폰은 잠깐 뒤집어 두자.",
"걷기 10분이 머리를 맑게 해줘.","오늘의 기록이 내일의 자신감이 돼.","목표는 크게, 할 일은 작게.",
"마감보다 하루 일찍 끝내는 기분, 느껴보자.","나를 칭찬하는 것도 습관이야.","지친 날엔 루틴 하나만 지켜도 돼.",
"할 일 목록이 길면, 제일 쉬운 것부터.","오늘 읽은 한 페이지가 쌓여 한 권이 돼.","미루고 싶을 땐 2분만 해보기.",
"따뜻한 차 한 잔과 함께 시작해.","괜찮아, 다들 처음엔 어려워했어.","오늘 흘린 땀은 배신하지 않아.",
"내가 정한 약속을 지키는 하루.","조용한 시간에 가장 많이 자라.","네가 생각하는 것보다 넌 더 단단해.",
"오늘의 목표: 어제의 나를 실망시키지 않기.","정리된 노션, 정리된 하루.","작게 시작해서 오래 가자.",
"꿈은 마감일이 있는 목표가 될 때 이루어져.","쉬는 날엔 마음 편히 쉬기.","오늘 잘한 일 하나 적어보기.",
"집중이 안 될 땐 자리를 바꿔봐.","천천히, 하지만 확실하게.","하루를 끝까지 버틴 너, 멋져.",
"지금 하는 공부가 미래의 선택지를 넓혀줘.","계획은 유연하게, 실행은 단단하게.","오늘도 한 칸 채우러 왔어.",
"잘 자는 것도 실력이야.","불안할 땐 지금 할 수 있는 일 하나.","내일의 나에게 쪽지 남기기.",
"할까 말까 할 땐, 하자.","작은 성공을 크게 축하하자.","오늘은 어제보다 1% 더.",
"모르는 걸 아는 게 배움의 시작.","목표를 다시 읽어보는 것만으로도 힘이 나.","운동화 끈부터 묶어보자.",
"끝까지 하는 사람이 결국 잘하는 사람이 돼.","오늘의 피곤함은 성장의 증거야.","한 번에 하나씩.",
"멈춰도 돼. 다시 걸으면 되니까.","너의 속도도 충분히 빨라.","작은 습관이 인생의 모양을 바꿔.",
"오늘은 나를 위해 시간을 써보자.","집중 한 세션, 휴식 한 세션.","창문 열고 숨 한 번 크게.",
"오늘 다 못 해도, 내일 이어서 하면 돼.","노력은 티가 안 나도 쌓이고 있어.","비교 대신 기록.",
"좋아하는 음악 한 곡으로 시작.","끝낸 일에 체크하는 그 기분, 놓치지 마.","하루 30분이 일 년이면 182시간이야.",
"마음이 복잡할 땐 종이에 적어봐.","오늘의 나에게 다정하게.","해낼 수 있어. 늘 그래왔잖아.",
"방해 요소는 멀리, 목표는 가까이.","천 리 길도 오늘의 한 걸음부터.","지금의 꾸준함이 나중의 여유가 돼.",
"오늘 배운 것 하나 말해보기.","실패는 데이터일 뿐이야.","자기 전에 내일 할 일 3개만.",
"아침 햇빛 5분 쬐기.","계속하는 힘이 가장 큰 힘이야.","오늘도 고양이처럼 여유롭게, 하지만 할 건 하고.",
"내가 고른 하루를 살자.","작심삼일도 열 번이면 한 달이야.","충분히 쉬었으면 다시 한 걸음.",
"오늘 하루, 너라서 해낼 수 있었어.","지금 미루는 일이 제일 중요한 일일지도.","목표에 가까워지는 중이야.",
"하루의 끝에 웃을 수 있게.","잘 먹고, 잘 자고, 잘 해내자.","올해의 마지막까지 함께 가자."
];
function quote(){
  const d=new Date(); const doy=Math.floor((d-new Date(d.getFullYear(),0,1))/86400000);
  const q=QUOTES[(doy+d.getFullYear())%QUOTES.length];
  root.innerHTML=`<div class="label">💬 오늘의 한마디 · ${d.getMonth()+1}.${d.getDate()}</div>
    <div class="row" style="align-items:center">${catSVG(3,true)}<div class="quote">${q}</div></div>`;
}
// 밤 숲 소리: Blanket 프로젝트의 공개 음원 사용 (출처는 README·사용 가이드에 표기)
function sound(){
  const SOUNDS=[['rain','🌧️','빗소리'],['fireplace','🔥','모닥불'],['summer-night','🦗','풀벌레'],['stream','🌊','시냇물'],['wind','🍃','바람']];
  let ac=null, master=null; const on={}, cache={};
  root.innerHTML=`<div class="label">🌲 밤 숲 소리</div>
    <div class="row" style="align-items:center">${catSVG(3,true)}<div class="sub" style="margin:0">여러 개를 섞어 들어도 좋아요</div></div>
    <div class="snd">${SOUNDS.map(([k,e,n])=>`<button class="btn" data-s="${k}"><span>${e}</span>${n}</button>`).join('')}</div>
    <input class="vol" id="vol" type="range" min="0" max="100" value="60" aria-label="볼륨">
    <div class="credit">소리: Blanket 프로젝트 공개 음원 · 빗소리 © alex36917 (CC BY)</div>`;
  async function buf(k){ if(!cache[k]){const r=await fetch('sounds/'+k+'.mp3'); cache[k]=await ac.decodeAudioData(await r.arrayBuffer());} return cache[k]; }
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=document.getElementById('vol').value/100;master.connect(ac.destination);}
    ac.resume(); const k=b.dataset.s;
    if(on[k]){const {src,g}=on[k];g.gain.setTargetAtTime(0,ac.currentTime,.3);setTimeout(()=>src.stop(),1200);delete on[k];b.classList.remove('on');return;}
    b.classList.add('on'); b.disabled=true;
    try{const bf=await buf(k); const src=ac.createBufferSource(),g=ac.createGain();
      src.buffer=bf;src.loop=true;src.loopStart=0.06;src.loopEnd=bf.duration-0.06;
      g.gain.setValueAtTime(0,ac.currentTime);g.gain.setTargetAtTime(1,ac.currentTime,.5);
      src.connect(g).connect(master);src.start(0,0.06);on[k]={src,g};}
    catch(e){b.classList.remove('on');} finally{b.disabled=false;}
  });
  document.getElementById('vol').oninput=e=>{ if(master) master.gain.value=e.target.value/100; };
}
// 공휴일 달력: 공휴일 데이터는 hyunbinseo/holidays-kr (MIT) 기반, 2026~2027년 포함
const HOL={"2026-01-01":"1월 1일","2026-02-16":"설날 전날","2026-02-17":"설날","2026-02-18":"설날 다음 날","2026-03-01":"3ㆍ1절","2026-03-02":"대체공휴일(3ㆍ1절)","2026-05-01":"노동절","2026-05-05":"어린이날","2026-05-24":"부처님 오신 날","2026-05-25":"대체공휴일(부처님 오신 날)","2026-06-03":"전국동시지방선거","2026-06-06":"현충일","2026-07-17":"제헌절","2026-08-15":"광복절","2026-08-17":"대체공휴일(광복절)","2026-09-24":"추석 전날","2026-09-25":"추석","2026-09-26":"추석 다음 날","2026-10-03":"개천절","2026-10-05":"대체공휴일(개천절)","2026-10-09":"한글날","2026-12-25":"기독탄신일","2027-01-01":"1월 1일","2027-02-06":"설날 전날","2027-02-07":"설날","2027-02-08":"설날 다음 날","2027-02-09":"대체공휴일(설날)","2027-03-01":"3ㆍ1절","2027-05-01":"노동절","2027-05-03":"대체공휴일(노동절)","2027-05-05":"어린이날","2027-05-13":"부처님 오신 날","2027-06-06":"현충일","2027-07-17":"제헌절","2027-07-19":"대체공휴일(제헌절)","2027-08-15":"광복절","2027-08-16":"대체공휴일(광복절)","2027-09-14":"추석 전날","2027-09-15":"추석","2027-09-16":"추석 다음 날","2027-10-03":"개천절","2027-10-04":"대체공휴일(개천절)","2027-10-09":"한글날","2027-10-11":"대체공휴일(한글날)","2027-12-25":"기독탄신일","2027-12-27":"대체공휴일(기독탄신일)"};
function cal(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const key=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  let g=['일','월','화','수','목','금','토'].map(d=>`<div class="h">${d}</div>`).join('');
  for(let i=0;i<first;i++) g+='<div class="d x">.</div>';
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d),k=key(dt),c=['d'];
    if(dt.getDay()===0)c.push('sun'); if(dt.getDay()===6)c.push('sat'); if(HOL[k])c.push('hol'); if(d===n.getDate())c.push('today');
    g+=`<div class="${c.join(' ')}" title="${HOL[k]||''}">${d}</div>`;}
  const today=new Date(y,m,n.getDate());
  const next=Object.keys(HOL).sort().find(k=>new Date(k+'T00:00:00')>=today);
  let foot='';
  if(next){const dd=Math.round((new Date(next+'T00:00:00')-today)/86400000);
    foot=`다음 공휴일 · ${HOL[next]} <b>${dd===0?'오늘!':'D-'+dd}</b>`;}
  root.innerHTML=`<div class="label">🗓️ ${y}년 ${m+1}월</div><div class="cal">${g}</div><div class="next">${foot}</div>`;
}
if(W==='pomo'){ pomo(); }
else if(W==='sound'){ sound(); }
else { const R={clock,dday,progress,quote,cal}[W]||clock; R(); setInterval(R, W==='clock'?1000*15:1000*60); }
</script>
